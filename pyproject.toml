[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "posereferenceforge"
version = "1.0.0-dev"
description = "Local Windows application for converting pose photographs into 3D mannequin pose references for external AI image-generation workflows."
readme = "README.md"
requires-python = "==3.12.10"
license = {text = "MIT"}
authors = [{name = "PoseReferenceForge"}]

dependencies = [
    "PySide6>=6.8",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "Pillow>=11.0",
    "scipy>=1.14",
    "onnxruntime-gpu>=1.19",
    "torch>=2.5",
    "torchvision>=0.20",
    "mediapipe>=0.10",
    "trimesh>=4.5",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "requests>=2.32",
    "filetype>=1.2",
    "packaging>=24.0",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
]
cpu = [
    "onnxruntime>=1.19",
]
blender = [
    "fake-bpy-module>=2025",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "schemas*", "blender*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
